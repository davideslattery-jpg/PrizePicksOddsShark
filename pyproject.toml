[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prizepicks-oddsshark"
version = "0.1.0"
description = "CLI that ranks PrizePicks player props by edge vs FanDuel (The Odds API v4)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Slattery" }]
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pp-odds = "prizepicks_oddsshark.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prizepicks_oddsshark = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
