name: Update edges board

on:
  # Manual only — conserves free-tier API credits (no scheduled burns)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-edges
  cancel-in-progress: true

jobs:
  export-edges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Export edges (The Odds API live or demo)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p docs/data
          OUT="docs/data/edges.json"
          # Manual free-tier: NBA + NFL + full NCAAF (college football), lean markets
          SPORTS="basketball_nba,americanfootball_nfl,americanfootball_ncaaf"
          MAX_EVENTS=2
          if [ -n "${ODDS_API_KEY:-}" ]; then
            echo "ODDS_API_KEY present — The Odds API lean export (--sport ${SPORTS}, no team filter)"
            if pp-odds --provider theoddsapi --sport "$SPORTS" --lean --min-edge 2 --max-events "$MAX_EVENTS" --export "$OUT"; then
              echo "Live The Odds API export OK"
            else
              echo "Live export failed — falling back to --demo"
              pp-odds --demo --sport basketball_nba --min-edge 2 --export "$OUT"
            fi
          elif [ -n "${ODDSPAPI_API_KEY:-}" ]; then
            echo "ODDS_API_KEY missing; OddsPapi fallback"
            if pp-odds --provider oddspapi --sport "$SPORTS" --lean --min-edge 2 --max-events "$MAX_EVENTS" --export "$OUT"; then
              echo "Live OddsPapi export OK"
            else
              echo "Live export failed — falling back to --demo"
              pp-odds --demo --sport basketball_nba --min-edge 2 --export "$OUT"
            fi
          else
            echo "No odds API secrets — publishing demo board"
            pp-odds --demo --sport basketball_nba --min-edge 2 --export "$OUT"
          fi
          python - <<'PY2'
          import json
          from collections import Counter
          from pathlib import Path
          p = Path("docs/data/edges.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert "edges" in data and "updated_at" in data
          counts = Counter(e.get("sport") or "?" for e in data.get("edges") or [])
          print(
              f"board mode={data.get('mode')} count={data.get('count')} "
              f"sports={data.get('sports')} per_sport={dict(counts)} "
              f"updated_at={data.get('updated_at')}"
          )
          PY2

      - name: Commit board if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/edges.json
          if git diff --staged --quiet; then
            echo "No changes to edges.json — skip commit"
          else
            git commit -m "chore: refresh docs/data/edges.json [skip ci]"
            git push
          fi
